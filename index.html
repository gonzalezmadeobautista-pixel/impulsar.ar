<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impulsar · Financiación de proyectos en Argentina</title>
<style>
:root{--navy:#0B1F3A;--navy2:#13305a;--bg:#F4F6F9;--card:#fff;--tx:#14213d;--mut:#5b6b82;--ac:#14B8A6;--ac2:#0d9488;--bd:#e3e8ef;--warn:#fff7e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#10213b;--tx:#e8eef7;--mut:#9fb0c8;--bd:#1f3558;--warn:#3a3114}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:6px;padding:12px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;margin-right:auto;display:flex;gap:8px;align-items:center}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:inline-block}
.nav a,.nav button.l{padding:8px 10px;border-radius:8px;color:#dbe6f5;font-size:14px;background:none;border:0;cursor:pointer;font-family:inherit}
.nav a:hover,.nav button.l:hover{background:var(--navy2)}
.btn{display:inline-block;border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;padding:11px 18px;border-radius:10px;background:var(--ac);color:#04231f;transition:.2s}
.btn:hover{background:#2dd4bf;transform:translateY(-1px)}
.btn.o{background:transparent;border:1.5px solid var(--bd);color:var(--tx)}.btn.o:hover{background:var(--card)}
.btn.w{background:#fff;color:var(--navy)}
main{max-width:1100px;margin:auto;padding:0 16px 60px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;margin:0 -16px;padding:64px 16px}
.hero>div{max-width:1100px;margin:auto}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 14px;max-width:700px}
.hero p{font-size:18px;color:#c6d6ee;max-width:620px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
h2{font-size:26px;margin:44px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(11,31,58,.14)}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative}
.demo{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.cb{padding:16px}.cb h3{margin:6px 0}.cb p{color:var(--mut);font-size:14px;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);padding:2px 9px;border-radius:99px;margin:0 4px 4px 0;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .8s}
.sm{font-size:13px;color:var(--mut)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 4px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.step{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}.step span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#04231f;font-weight:800}
.warn{background:var(--warn);border:1px solid #e8c95a;border-radius:12px;padding:12px 14px;font-size:13px;margin:14px 0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-top:14px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:18px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.cta{background:var(--navy);color:#fff;border-radius:20px;padding:40px 20px;text-align:center;margin-top:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--card);padding:22px;border-radius:16px;max-width:440px;width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat div{background:var(--bg);border-radius:12px;padding:14px}.stat b{font-size:24px;display:block}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px 16px}
</style>
</head>
<body>
<header><div class="nav">
<a class="logo" href="#/"><i></i>Impulsar</a>
<a href="#/explorar">Explorar proyectos</a><a href="#/publicar">Publicar un proyecto</a><a href="#/como">Cómo funciona</a>
<span id="auth"></span><a class="btn" href="#/publicar" style="color:#04231f">Publicá tu proyecto</a>
</div></header>
<main id="app"></main>
<footer>Impulsar · MVP. Invertir o aportar implica riesgos, incluida la pérdida del capital. No garantizamos rentabilidad.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pegá acá los datos de tu proyecto de Supabase (Settings → API) ======
var CFG={URL:"https://vcjikeutvwhahdmuitsr.supabase.co",KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjamlrZXV0dndoYWhkbXVpdHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzQ0MTIsImV4cCI6MjEwNzg1MDQxMn0.s721wO8nom0zhGQmBmRtMVMN4axHuXzaKIcMyULLcSc"};
// ======================================================================================
var CATS=["Tecnología e inteligencia artificial","Aplicaciones y software","Alimentos y bebidas","Moda y diseño","Salud y bienestar","Educación","Medioambiente","Industria y producción","Comercio","Servicios","Proyectos sociales","Otros emprendimientos"];
var PROVS=["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Córdoba","Corrientes","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"];
var STAGES=["Idea","Prototipo","Primeras ventas","Negocio en crecimiento"];
var MODES=["Participación","Préstamo","Recompensas / preventa","Aporte sin contraprestación"];
var MODEINFO={"Participación":"Se aporta capital a cambio de una posible participación societaria. Requiere estructura legal válida y revisión normativa (CNV). Riesgo: pérdida total del capital.","Préstamo":"El emprendedor devuelve el dinero con plazos e intereses acordados. Riesgo: incumplimiento o demoras.","Recompensas / preventa":"El aporte se canjea por un producto o servicio futuro. Riesgo: demoras o que el producto no se concrete.","Aporte sin contraprestación":"Apoyo sin devolución económica esperada."};
var ST={borrador:"Borrador",en_revision:"En revisión",publicado:"Publicado",rechazado:"Rechazado"};
var sb=null,ME=null,PROF=null,FAVS=[],PUB=[],T="proyectos";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ars(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0)}
function fdate(d){return new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
function opts(a,sel){return a.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function go(h){location.hash=h}
function ok(r){if(r.error)throw r.error;return r.data}

/* ---------- sesión ---------- */
async function setUser(s){
  ME=s?s.user:null;PROF=null;FAVS=[];
  if(ME){
    PROF=(await sb.from("profiles").select("*").eq("id",ME.id).maybeSingle()).data;
    FAVS=((await sb.from("favorites").select("project_id").eq("user_id",ME.id)).data||[]).map(function(x){return x.project_id});
  }
  authBar();
}
function authBar(){$("#auth").innerHTML=ME?'<a href="#/panel">👤 '+esc(PROF?PROF.name:"Mi panel")+(PROF&&PROF.is_admin?' · Admin':'')+'</a><button class="l" onclick="logout()">Salir</button>':'<a href="#/entrar">Iniciar sesión</a><a href="#/entrar?r=1">Registrarse</a>'}
async function logout(){await sb.auth.signOut();go("#/");toast("Sesión cerrada")}

/* ---------- tarjetas ---------- */
function card(p){
  var pc=p.goal>0?Math.round(p.raised/p.goal*100):0,f=FAVS.indexOf(p.id)>-1;
  return '<div class="card"><div class="thumb" style="background:linear-gradient(135deg,#0B1F3A,#14B8A6);color:#fff;font-weight:800">'+esc((p.name||"?").charAt(0).toUpperCase())+'</div><div class="cb"><span class="sm">'+esc(p.category)+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.description)+'</p><div><span class="tag">📍 '+esc(p.province)+'</span><span class="tag">'+esc(p.stage)+'</span><span class="tag">'+esc(p.mode)+'</span></div><div class="bar"><b style="width:'+Math.min(pc,100)+'%"></b></div><div class="sm"><b>'+ars(p.raised)+'</b> de '+ars(p.goal)+' · '+pc+'%</div><div class="row" style="margin-top:12px"><a class="btn" href="#/p/'+p.id+'">Ver proyecto</a><button class="btn o" onclick="fav(\''+p.id+'\')">'+(f?'★':'☆')+'</button></div></div></div>';
}
async function fav(id){
  if(!ME){toast("Iniciá sesión para guardar favoritos");return go("#/entrar")}
  var i=FAVS.indexOf(id);
  if(i>-1){ok(await sb.from("favorites").delete().eq("user_id",ME.id).eq("project_id",id));FAVS.splice(i,1)}
  else{ok(await sb.from("favorites").insert({user_id:ME.id,project_id:id}));FAVS.push(id)}
  route();
}
async function pubs(){return ok(await sb.from("projects").select("*").eq("status","publicado").order("created_at",{ascending:false}))||[]}

/* ---------- vistas ---------- */
var V={};
function steps(){return '<div class="steps"><div class="step"><span>1</span><h3>Publicá tu idea</h3><p class="sm">Explicá qué necesitás y cuánto dinero requiere tu proyecto.</p></div><div class="step"><span>2</span><h3>Conectá con interesados</h3><p class="sm">Recibí consultas de personas que quieren financiarla.</p></div><div class="step"><span>3</span><h3>Desarrollá y compartí avances</h3><p class="sm">Contá cómo avanzás, según los acuerdos establecidos.</p></div></div>'}
V.home=async function(){
  var l=(await pubs()).slice(0,3);
  return '<section class="hero"><div><h1>Las grandes ideas necesitan oportunidades.</h1><p>Conectamos emprendedores que buscan financiación con personas que quieren impulsar los próximos grandes proyectos de Argentina.</p><div class="row"><a class="btn" href="#/publicar">Tengo un proyecto</a><a class="btn w" href="#/explorar">Quiero financiar ideas</a></div></div></section><h2>Proyectos destacados</h2>'
  +(l.length?'<div class="grid">'+l.map(card).join("")+'</div><div class="row"><a class="btn o" href="#/explorar">Ver todos con filtros</a></div>':'<div class="panel"><p>Todavía no hay proyectos publicados. ¡Sé el primero en presentar el tuyo!</p><a class="btn" href="#/publicar">Publicar un proyecto</a></div>')
  +'<h2>Cómo funciona</h2>'+steps()+'<h2>Confianza y transparencia</h2><div class="steps"><div class="step"><b>🔍 Revisión de proyectos</b><p class="sm">Todo proyecto es revisado por el equipo antes de publicarse.</p></div><div class="step"><b>🪪 Verificación de identidad</b><p class="sm">Prevista como función futura. Hoy no marcamos a nadie como “verificado”.</p></div><div class="step"><b>📄 Condiciones claras</b><p class="sm">Cada modalidad muestra sus condiciones y riesgos. No garantizamos rentabilidad.</p></div></div><div class="cta"><h2 style="margin:0 0 16px">Tu próxima gran oportunidad puede empezar acá.</h2><div class="row" style="justify-content:center"><a class="btn" href="#/publicar">Publicar un proyecto</a><a class="btn w" href="#/explorar">Explorar oportunidades</a></div></div>';
};
V.como=async function(){return '<h2>Cómo funciona</h2>'+steps()+'<h2>Modalidades</h2><div class="grid">'+MODES.map(function(m){return '<div class="step"><b>'+m+'</b><p class="sm">'+MODEINFO[m]+'</p></div>'}).join("")+'</div><div class="warn">⚠️ Por ahora Impulsar es un espacio de publicación, descubrimiento y contacto. No procesa pagos ni custodia fondos hasta completar la revisión legal (CNV, prevención de lavado de activos, protección de datos).</div>'};
var F={q:"",cat:"",prov:"",stage:"",mode:"",max:"",sort:"nov",fav:false};
V.explorar=async function(){
  PUB=await pubs();
  return '<h2>Explorar proyectos</h2><div class="filters"><input id="fq" placeholder="Buscar…" value="'+esc(F.q)+'"><select id="fc"><option value="">Categoría</option>'+opts(CATS,F.cat)+'</select><select id="fp"><option value="">Provincia</option>'+opts(PROVS,F.prov)+'</select><select id="fs"><option value="">Etapa</option>'+opts(STAGES,F.stage)+'</select><select id="fm"><option value="">Modalidad</option>'+opts(MODES,F.mode)+'</select><select id="fx"><option value="">Monto máx.</option>'+[2000000,5000000,10000000,50000000].map(function(v){return '<option value="'+v+'"'+(String(v)===F.max?' selected':'')+'>Hasta '+ars(v)+'</option>'}).join("")+'</select><select id="fo"><option value="nov"'+(F.sort==="nov"?" selected":"")+'>Novedades</option><option value="pct"'+(F.sort==="pct"?" selected":"")+'>% de financiación</option><option value="pop"'+(F.sort==="pop"?" selected":"")+'>Monto recaudado</option></select></div><label style="display:inline-flex;gap:6px;align-items:center;margin:0 0 14px"><input type="checkbox" id="ff" style="width:auto"'+(F.fav?" checked":"")+'> Solo mis favoritos</label><div class="grid" id="list"></div>';
};
function list(){
  var r=PUB.filter(function(p){return(!F.q||(p.name+p.description+p.category).toLowerCase().indexOf(F.q.toLowerCase())>-1)&&(!F.cat||p.category===F.cat)&&(!F.prov||p.province===F.prov)&&(!F.stage||p.stage===F.stage)&&(!F.mode||p.mode===F.mode)&&(!F.max||p.goal<=+F.max)&&(!F.fav||FAVS.indexOf(p.id)>-1)});
  if(F.sort==="pct")r.sort(function(a,b){return b.raised/b.goal-a.raised/a.goal});else if(F.sort==="pop")r.sort(function(a,b){return b.raised-a.raised});
  $("#list").innerHTML=r.length?r.map(card).join(""):'<p class="sm">No hay proyectos que coincidan.</p>';
}
function bindF(){[["fq","q"],["fc","cat"],["fp","prov"],["fs","stage"],["fm","mode"],["fx","max"],["fo","sort"]].forEach(function(x){$("#"+x[0]).oninput=function(){F[x[1]]=this.value;list()}});$("#ff").onchange=function(){F.fav=this.checked;list()};list()}

V.proyecto=async function(id){
  var p=ok(await sb.from("projects").select("*").eq("id",id).maybeSingle());
  if(!p)return '<h2>Proyecto no encontrado</h2><p class="sm">Puede que todavía no esté publicado.</p>';
  var o=(await sb.from("profiles").select("name").eq("id",p.owner).maybeSingle()).data;
  var pc=p.goal>0?Math.round(p.raised/p.goal*100):0,f=FAVS.indexOf(p.id)>-1,mine=ME&&ME.id===p.owner;
  return '<h2>'+esc(p.name)+'</h2>'+(p.status!=="publicado"?'<div class="warn">Estado: <b>'+ST[p.status]+'</b>. Solo vos y el equipo de revisión pueden ver este proyecto.</div>':'')
  +'<div class="two"><div><div class="panel"><p class="sm">Creador: '+esc(o?o.name:"—")+' · Publicado el '+fdate(p.created_at)+'</p><h3>Descripción</h3><p>'+esc(p.description)+'</p><h3>Problema</h3><p>'+esc(p.problem)+'</p><h3>Solución</h3><p>'+esc(p.solution)+'</p><h3>Destino de los fondos</h3><p>'+esc(p.use_of_funds)+'</p><h3>Equipo</h3><p>'+esc(p.team)+'</p></div><div class="panel"><h3>Modalidad: '+esc(p.mode)+'</h3><p>'+MODEINFO[p.mode]+'</p><div class="warn">Esta modalidad está sujeta a revisión legal. Invertir o aportar implica riesgos y no se garantiza rentabilidad. Impulsar no verifica ni garantiza la información publicada por los emprendedores.</div></div></div>'
  +'<div><div class="panel"><span class="tag">'+esc(p.category)+'</span><span class="tag">📍 '+esc(p.province)+'</span><span class="tag">'+esc(p.stage)+'</span><h3 style="margin:10px 0 0">'+ars(p.raised)+'</h3><div class="sm">recaudado de '+ars(p.goal)+'</div><div class="bar"><b style="width:'+Math.min(pc,100)+'%"></b></div><div class="sm">'+pc+'% alcanzado</div><div class="row">'+(mine?'':'<button class="btn" onclick="msgBox(\''+p.id+'\',\''+p.owner+'\')">Contactar al creador</button>')+'<button class="btn o" onclick="fav(\''+p.id+'\')">'+(f?'★ Guardado':'☆ Guardar')+'</button></div></div></div></div>';
};
function msgBox(pid,to){
  if(!ME){toast("Iniciá sesión para enviar mensajes");return go("#/entrar")}
  var m=document.createElement("div");m.className="modal";
  m.innerHTML='<div><h3>Enviar mensaje</h3><textarea id="mt" rows="5" maxlength="2000" placeholder="Escribí tu mensaje…"></textarea><p class="sm">No compartas datos bancarios ni contraseñas.</p><div class="row"><button class="btn" id="ms">Enviar</button><button class="btn o" id="mc">Cancelar</button></div></div>';
  document.body.appendChild(m);
  $("#mc").onclick=function(){m.remove()};
  $("#ms").onclick=async function(){
    var t=$("#mt").value.trim();if(t.length<5)return toast("Escribí al menos 5 caracteres");
    var r=await sb.from("messages").insert({project_id:pid,from_user:ME.id,to_user:to,body:t});
    if(r.error)return toast("No se pudo enviar: "+r.error.message);
    m.remove();toast("Mensaje enviado");
  };
}

V.entrar=async function(){
  var reg=location.hash.indexOf("r=1")>-1;
  return '<div class="panel" style="max-width:440px;margin:40px auto"><h2 style="margin-top:0">'+(reg?"Crear cuenta":"Iniciar sesión")+'</h2>'+(reg?'<label>Nombre o nombre comercial</label><input id="un"><label>Rol</label><select id="ur"><option>Emprendedor</option><option>Inversor</option><option>Ambos</option></select>':'')+'<label>Correo electrónico</label><input id="ue" type="email"><label>Contraseña (mínimo 8 caracteres)</label><input id="up" type="password"><div class="row"><button class="btn" onclick="doAuth('+reg+')">Continuar</button><a class="btn o" href="#/entrar'+(reg?'':'?r=1')+'">'+(reg?"Ya tengo cuenta":"Crear cuenta")+'</a></div></div>';
};
async function doAuth(reg){
  var e=$("#ue").value.trim(),pw=$("#up").value,r;
  if(!/^\S+@\S+\.\S+$/.test(e)||pw.length<8)return toast("Ingresá un correo válido y una contraseña de 8 o más caracteres");
  if(reg){
    var n=$("#un").value.trim();if(n.length<2)return toast("Ingresá tu nombre");
    r=await sb.auth.signUp({email:e,password:pw,options:{data:{name:n,role:$("#ur").value}}});
    if(r.error)return toast(r.error.message);
    if(!r.data.session){$("#app").innerHTML='<div class="panel" style="max-width:440px;margin:40px auto"><h3>Revisá tu correo</h3><p>Te enviamos un mensaje para confirmar tu cuenta. Después podés iniciar sesión.</p></div>';return}
  }else{
    r=await sb.auth.signInWithPassword({email:e,password:pw});
    if(r.error)return toast("Correo o contraseña incorrectos");
  }
  go("#/panel");
}

V.publicar=async function(){
  if(!ME)return '<div class="panel" style="margin-top:30px"><h2 style="margin-top:0">Publicá tu proyecto</h2><p>Necesitás una cuenta para presentar un proyecto.</p><a class="btn" href="#/entrar?r=1">Registrarme</a></div>';
  return '<h2>Presentar un proyecto</h2><div class="panel"><label>Nombre del proyecto</label><input id="n" maxlength="80"><label>Descripción breve</label><input id="d" maxlength="200"><label>Problema que resuelve</label><textarea id="pr" rows="3"></textarea><label>Solución propuesta</label><textarea id="so" rows="3"></textarea><label>Categoría</label><select id="c">'+opts(CATS)+'</select><label>Provincia</label><select id="pv">'+opts(PROVS)+'</select><label>Etapa</label><select id="st">'+opts(STAGES)+'</select><label>Monto necesario (ARS)</label><input id="g" type="number" min="1000"><label>Desglose del uso de fondos</label><textarea id="u" rows="3"></textarea><label>Equipo</label><input id="t"><label>Modalidad de financiación</label><select id="m">'+opts(MODES)+'</select><div class="warn">Tu proyecto no se hace público de inmediato: queda “En revisión” hasta que el equipo de Impulsar lo apruebe. Aún no se pueden subir imágenes ni documentos.</div><div class="row"><button class="btn o" onclick="saveP(\'borrador\')">Guardar borrador</button><button class="btn" onclick="saveP(\'en_revision\')">Enviar a revisión</button></div></div>';
};
async function saveP(status){
  var g=+$("#g").value,n=$("#n").value.trim(),d=$("#d").value.trim();
  if(n.length<3||d.length<10||!(g>0))return toast("Completá nombre, descripción (mín. 10 caracteres) y un monto válido");
  var r=await sb.from("projects").insert({owner:ME.id,name:n,description:d,problem:$("#pr").value.trim(),solution:$("#so").value.trim(),use_of_funds:$("#u").value.trim(),team:$("#t").value.trim(),category:$("#c").value,province:$("#pv").value,stage:$("#st").value,goal:g,mode:$("#m").value,status:status});
  if(r.error)return toast("No se pudo guardar: "+r.error.message);
  T="proyectos";toast(status==="borrador"?"Borrador guardado":"Enviado a revisión. Te avisamos en tu panel.");go("#/panel");
}
async function submitP(id){var r=await sb.from("projects").update({status:"en_revision"}).eq("id",id);if(r.error)return toast(r.error.message);toast("Enviado a revisión");route()}
async function setStatus(id,s){
  var u={status:s,reviewed_at:new Date().toISOString(),reject_reason:null};
  if(s==="rechazado"){var m=prompt("Motivo del rechazo (lo verá el emprendedor):");if(m===null)return;u.reject_reason=m.trim()||"Sin motivo indicado"}
  var r=await sb.from("projects").update(u).eq("id",id);if(r.error)return toast(r.error.message);
  toast(s==="publicado"?"Proyecto aprobado y publicado":"Proyecto rechazado");route();
}
function tab(t){T=t;route()}

/* ---------- panel ---------- */
var PT={};
PT.proyectos=async function(){
  var l=ok(await sb.from("projects").select("*").eq("owner",ME.id).order("created_at",{ascending:false}))||[];
  return '<div class="panel"><h3>Mis proyectos</h3>'+(l.length?l.map(function(p){return '<p><b><a href="#/p/'+p.id+'"><u>'+esc(p.name)+'</u></a></b> · '+ars(p.goal)+' · <span class="tag">'+ST[p.status]+'</span> <span class="sm">'+fdate(p.created_at)+'</span>'+(p.status==="rechazado"?'<br><span class="sm">Motivo: '+esc(p.reject_reason)+'</span>':'')+((p.status==="borrador"||p.status==="rechazado")?' <button class="btn o" style="padding:4px 10px;font-size:12px" onclick="submitP(\''+p.id+'\')">Enviar a revisión</button>':'')+'</p>'}).join(""):'<p class="sm">Todavía no presentaste proyectos. <a href="#/publicar"><u>Presentar uno</u></a></p>')+'</div>';
};
PT.favoritos=async function(){
  var l=FAVS.length?ok(await sb.from("projects").select("*").in("id",FAVS)):[];
  return '<div class="panel"><h3>Favoritos</h3><div class="grid">'+(l.map(card).join("")||'<p class="sm">Sin favoritos.</p>')+'</div></div>';
};
PT.mensajes=async function(){
  var l=ok(await sb.from("messages").select("*,projects(name),sender:profiles!from_user(name),recipient:profiles!to_user(name)").or("from_user.eq."+ME.id+",to_user.eq."+ME.id).order("created_at",{ascending:false}))||[];
  return '<div class="panel"><h3>Mensajes</h3>'+(l.map(function(m){var rec=m.to_user===ME.id;return '<p class="sm"><b>'+esc(m.projects?m.projects.name:"Proyecto")+'</b> · '+(rec?'Recibido de '+esc(m.sender?m.sender.name:"—"):'Enviado a '+esc(m.recipient?m.recipient.name:"—"))+' · '+fdate(m.created_at)+'<br>'+esc(m.body)+(rec?'<br><button class="btn o" style="padding:4px 10px;font-size:12px" onclick="msgBox(\''+m.project_id+'\',\''+m.from_user+'\')">Responder</button>':'')+'</p>'}).join("")||'<p class="sm">Sin mensajes.</p>')+'</div>';
};
PT.revision=async function(){
  var l=ok(await sb.from("projects").select("*,owner_profile:profiles!owner(name)").eq("status","en_revision").order("created_at"))||[];
  return '<div class="panel"><h3>Proyectos esperando tu aprobación</h3>'+(l.length?l.map(function(p){return '<div class="panel" style="margin-top:12px"><b>'+esc(p.name)+'</b> · '+ars(p.goal)+' · '+esc(p.mode)+'<br><span class="sm">Por '+esc(p.owner_profile?p.owner_profile.name:"—")+' · '+esc(p.category)+' · '+esc(p.province)+' · '+esc(p.stage)+' · enviado el '+fdate(p.created_at)+'</span><p>'+esc(p.description)+'</p><p class="sm"><b>Problema:</b> '+esc(p.problem)+'<br><b>Solución:</b> '+esc(p.solution)+'<br><b>Uso de fondos:</b> '+esc(p.use_of_funds)+'<br><b>Equipo:</b> '+esc(p.team)+'</p><div class="row"><button class="btn" onclick="setStatus(\''+p.id+'\',\'publicado\')">Aprobar y publicar</button><button class="btn o" onclick="setStatus(\''+p.id+'\',\'rechazado\')">Rechazar</button></div></div>'}).join(""):'<p class="sm">No hay solicitudes pendientes.</p>')+'</div>';
};
V.panel=async function(){
  if(!ME)return V.entrar();
  var adm=!!(PROF&&PROF.is_admin),tabs=[["proyectos","Mis proyectos"],["favoritos","Favoritos"],["mensajes","Mensajes"]];
  if(adm){var c=await sb.from("projects").select("id",{count:"exact",head:true}).eq("status","en_revision");tabs.push(["revision","Solicitudes de revisión ("+(c.count||0)+")"])}
  if(T==="revision"&&!adm)T="proyectos";
  var body=await PT[T]();
  return '<h2>Hola, '+esc(PROF?PROF.name:"")+'</h2><div class="row" style="margin:0 0 6px">'+tabs.map(function(t){return '<button class="btn'+(T===t[0]?'':' o')+'" onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div>'+body;
};

/* ---------- router ---------- */
async function route(){
  var h=location.hash.replace(/\?.*$/,"")||"#/",p=h.split("/"),out;
  try{
    out=h==="#/explorar"?await V.explorar():h==="#/como"?await V.como():h==="#/entrar"?await V.entrar():h==="#/publicar"?await V.publicar():h==="#/panel"?await V.panel():p[1]==="p"?await V.proyecto(p[2]):await V.home();
  }catch(e){out='<div class="warn">Ocurrió un error: '+esc(e.message||e)+'</div>'}
  $("#app").innerHTML=out;
  if(h==="#/explorar"&&$("#fq"))bindF();
  window.scrollTo(0,0);
}
async function init(){
  if(CFG.URL.indexOf("TU-PROYECTO")>-1){
    $("#app").innerHTML='<div class="panel" style="margin-top:30px"><h2 style="margin-top:0">Falta configurar Supabase</h2><p>Abrí este archivo, buscá <b>CFG</b> al principio del script y pegá la URL y la clave pública (anon) de tu proyecto de Supabase. Antes, ejecutá <b>schema.sql</b> en el editor SQL de Supabase.</p></div>';return;
  }
  sb=supabase.createClient(CFG.URL,CFG.KEY);
  await setUser((await sb.auth.getSession()).data.session);
  sb.auth.onAuthStateChange(function(ev,s){var nid=s?s.user.id:null;if(nid===(ME?ME.id:null))return;setTimeout(function(){setUser(s).then(route)},0)});
  window.addEventListener("hashchange",route);
  route();
}
init();
</script>
</body>
</html>
